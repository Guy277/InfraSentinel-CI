<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfraSentinel-CI - Connexion</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CclipPath id='a'%3E%3Ccircle cx='32' cy='32' r='30'/%3E%3C/clipPath%3E%3C/defs%3E%3Cg clip-path='url(%23a)'%3E%3Crect width='21.33' height='64' fill='%23F77F00'/%3E%3Crect x='21.33' width='21.34' height='64' fill='%23FFFFFF'/%3E%3Crect x='42.67' width='21.33' height='64' fill='%23009739'/%3E%3C/g%3E%3Ccircle cx='32' cy='32' r='30' fill='none' stroke='rgba(0,0,0,0.12)' stroke-width='2'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <span class="brand-flag large" aria-hidden="true">
                    <svg viewBox="0 0 64 64" role="img" focusable="false">
                        <defs>
                            <clipPath id="login-flag-clip">
                                <circle cx="32" cy="32" r="30"></circle>
                            </clipPath>
                        </defs>
                        <g clip-path="url(#login-flag-clip)">
                            <rect width="21.33" height="64" fill="#F77F00"></rect>
                            <rect x="21.33" width="21.34" height="64" fill="#FFFFFF"></rect>
                            <rect x="42.67" width="21.33" height="64" fill="#009739"></rect>
                        </g>
                        <circle cx="32" cy="32" r="30" fill="none" stroke="rgba(0,0,0,0.12)" stroke-width="2"></circle>
                    </svg>
                </span>
                <h2>InfraSentinel-CI</h2>
                <p>Authentification requise</p>
            </div>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Utilisateur</label>
                    <input type="text" id="username" name="username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-full">Se connecter</button>
                <p id="login-error" class="error-msg hidden">Identifiants incorrects</p>
            </form>
        </div>
    </div>
    <script>
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const credentials = btoa(user + ':' + pass);
            fetch('/api/stats', {
                headers: { 'Authorization': 'Basic ' + credentials }
            }).then(r => {
                if (r.ok) {
                    window.location.href = '/';
                } else {
                    document.getElementById('login-error').classList.remove('hidden');
                }
            }).catch(() => {
                document.getElementById('login-error').classList.remove('hidden');
            });
        });
    </script>
</body>
</html>
